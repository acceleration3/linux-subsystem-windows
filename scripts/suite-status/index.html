<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suite status</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --line: #e2e5ea; --text: #1b1f27; --dim: #667085; --faint: #98a2b3;
  --ok: #2e9e63; --fail: #d6453d; --timeout: #d98a1c; --crash: #a23bbf; --skip: #9aa4b2; --todo: #e6e9ee;
  --accent: #3466d6; --chip: #eef1f5; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #272d36; --text: #e7eaef; --dim: #9aa4b2; --faint: #6b7584;
    --ok: #3fb97a; --fail: #ef6259; --timeout: #e6a23c; --crash: #c56be0; --skip: #5d6775; --todo: #242a33;
    --accent: #6f9bff; --chip: #20262e; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 20px 24px 8px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
#stamp { color: var(--dim); font-variant-numeric: tabular-nums; }
#stamp.stale { color: var(--fail); }
main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 16px; padding: 12px 24px 40px; align-items: start; }
.machine { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.machine > .top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.machine h2 { font-size: 16px; margin: 0; font-weight: 650; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--dim); white-space: nowrap; }
.pill.running { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.bad { background: color-mix(in srgb, var(--fail) 16%, transparent); color: var(--fail); }
.spacer { flex: 1; }
.note { padding: 14px 16px; color: var(--dim); }
.run { padding: 12px 16px 4px; }
.run + .run { border-top: 1px solid var(--line); }
.runname { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.runname b { font-weight: 600; }
.runname span { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.part { padding: 10px 0 12px; }
.part + .part { border-top: 1px dashed var(--line); }
.partname { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.partname .gpu { font-weight: 600; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--dim); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.live.on { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .live.on { animation: none; } }
.bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--todo); margin: 8px 0 6px; }
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--ok); } .bar .fail { background: var(--fail); } .bar .timeout { background: var(--timeout); }
.bar .crash { background: var(--crash); } .bar .skip { background: var(--skip); } .bar .other { background: var(--faint); }
.figures { display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; color: var(--dim); }
.figures b { color: var(--text); font-weight: 600; }
.figures .ok b { color: var(--ok); } .figures .fail b { color: var(--fail); } .figures .timeout b { color: var(--timeout); } .figures .crash b { color: var(--crash); }
.apis { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.api { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--dim); font-variant-numeric: tabular-nums; }
.api.bad { color: var(--fail); background: color-mix(in srgb, var(--fail) 12%, transparent); }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); user-select: none; width: fit-content; }
.rows { margin-top: 6px; max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 2px 10px; padding: 6px 10px; }
.row + .row { border-top: 1px solid var(--line); }
.row .state { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.row .state.fail { color: var(--fail); } .row .state.timeout { color: var(--timeout); } .row .state.crash { color: var(--crash); }
.row .id { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
.row .why { grid-column: 2; color: var(--dim); font-size: 12.5px; overflow-wrap: anywhere; }
input.find { width: 100%; margin-top: 6px; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
.empty { padding: 60px 24px; color: var(--dim); text-align: center; grid-column: 1 / -1; }
.pill.silent { background: color-mix(in srgb, var(--timeout) 18%, transparent); color: var(--timeout); }
.live.silent { background: var(--timeout); }
.live.done { background: var(--accent); }
.statetext { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.statetext.running { color: var(--ok); } .statetext.silent { color: var(--timeout); }
.inv { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.invname { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.invname .label { font-weight: 600; font-size: 13px; }
.bar .running { background: repeating-linear-gradient(135deg, var(--accent) 0 5px, color-mix(in srgb, var(--accent) 55%, transparent) 5px 10px); }
.now { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.now .head { padding: 4px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); background: var(--chip); }
.now .item { display: flex; gap: 10px; padding: 4px 10px; align-items: baseline; }
.now .item + .item { border-top: 1px solid var(--line); }
.now .item .id { flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
.now .item .for { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12.5px; }
.now .more { padding: 4px 10px; color: var(--faint); font-size: 12px; border-top: 1px solid var(--line); }
@media (max-width: 520px) {
  header { padding: 14px 12px 4px; }
  main { padding: 8px 8px 28px; gap: 10px; }
  .machine > .top, .run { padding-left: 12px; padding-right: 12px; }
  .inv { padding: 8px; }
  .figures { gap: 4px 12px; }
  .row { grid-template-columns: 1fr; }
  .row .why { grid-column: 1; }
}
</style>
</head>
<body>
<header>
  <h1>Suite status</h1>
  <span id="stamp">reading…</span>
</header>
<main id="machines"><div class="empty">reading the machines…</div></main>
<script>
const order = ["ok", "fail", "timeout", "crash", "skip"];
const runningShown = 8;
const open = new Set();
const finds = new Map();
let lastGood = 0;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function span(seconds) {
  if (seconds < 90) return Math.max(0, Math.round(seconds)) + " s";
  if (seconds < 5400) return Math.round(seconds / 60) + " min";
  return (seconds / 3600).toFixed(1) + " h";
}
function clock(text) {
  const date = new Date(text);
  return isNaN(date) ? "" : date.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
}
function stateText(thing) {
  if (thing.state === "running") return "running";
  if (thing.state === "silent") return "silent since " + clock(thing.silent_since);
  if (thing.end) return (thing.end.complete ? "finished " : "ended incomplete ") + clock(thing.end.time);
  return "finished";
}
function dot(state) {
  return el("span", "live" + (state === "running" ? " on" : state === "silent" ? " silent" : " done"));
}
function failuresNode(key, inv) {
  const total = inv.failures.length + inv.failures_cut;
  const box = el("details");
  box.open = open.has(key);
  box.addEventListener("toggle", () => box.open ? open.add(key) : open.delete(key));
  box.append(el("summary", "", total + " not passing"));
  const find = el("input", "find");
  find.placeholder = "filter by id or reason";
  find.value = finds.get(key) || "";
  const rows = el("div", "rows");
  const fill = () => {
    const needle = find.value.toLowerCase();
    finds.set(key, find.value);
    rows.replaceChildren();
    for (const failure of inv.failures) {
      if (needle && !(failure.id + " " + failure.reason).toLowerCase().includes(needle)) continue;
      const row = el("div", "row");
      row.append(el("span", "state " + failure.status, failure.status), el("span", "id", failure.id));
      if (failure.reason) row.append(el("span", "why", failure.reason));
      rows.append(row);
    }
    if (inv.failures_cut) rows.append(el("div", "row", "… and " + inv.failures_cut + " more not listed"));
  };
  find.addEventListener("input", fill);
  fill();
  box.append(find, rows);
  return box;
}
function invocationNode(key, inv) {
  const node = el("div", "inv");
  const name = el("div", "invname");
  name.append(dot(inv.state));
  name.append(el("span", "label", inv.label || "started " + clock(inv.first_report)));
  for (const suite of inv.suites) name.append(el("span", "badge", suite));
  if (inv.jobs) name.append(el("span", "badge", inv.jobs + " at a time"));
  name.append(el("span", "statetext " + inv.state, stateText(inv)));
  if (inv.end && inv.end.crashed) name.append(el("span", "pill bad", inv.end.crashed + " crashed"));
  if (inv.end && inv.end.timed_out) name.append(el("span", "pill bad", inv.end.timed_out + " timed out"));
  node.append(name);

  const bar = el("div", "bar");
  let counted = 0;
  const piece = (cls, count, title) => {
    if (!count || !inv.planned) return;
    const part = el("i", cls);
    part.style.width = (100 * count / inv.planned) + "%";
    part.title = title + " " + count;
    bar.append(part);
  };
  for (const state of order) {
    counted += inv.counts[state] || 0;
    piece(state, inv.counts[state] || 0, state);
  }
  piece("other", inv.done - counted, "other");
  piece("running", inv.running.length, "running");
  node.append(bar);

  const figures = el("div", "figures");
  const done = el("span");
  done.append(el("b", "", String(inv.done)), " of " + inv.planned + " planned");
  figures.append(done);
  for (const state of order) {
    const count = inv.counts[state] || 0;
    if (!count && state !== "ok" && state !== "fail") continue;
    const item = el("span", state);
    item.append(el("b", "", String(count)), " " + state);
    figures.append(item);
  }
  if (inv.state === "running" && inv.checks_per_minute !== null) {
    const rate = el("span");
    rate.append(el("b", "", String(inv.checks_per_minute)), " checks/min");
    figures.append(rate);
  }
  if (inv.state !== "finished") figures.append(el("span", "", "last report " + span(inv.seconds_since_report) + " ago"));
  if (inv.resends) figures.append(el("span", "", "sent again " + inv.resends + " times"));
  node.append(figures);

  const apis = el("div", "apis");
  for (const api of Object.keys(inv.apis).sort()) {
    const tally = inv.apis[api];
    apis.append(el("span", "api" + (tally.bad ? " bad" : ""), api + " " + tally.done + "/" + tally.planned + (tally.bad ? " · " + tally.bad + " bad" : "")));
  }
  node.append(apis);

  if (inv.running.length) {
    const now = el("div", "now");
    now.append(el("div", "head", inv.state === "silent" ? "running at the last report" : "running now"));
    for (const check of inv.running.slice(0, runningShown)) {
      const item = el("div", "item");
      item.append(el("span", "id", check.id), el("span", "for", span(check.seconds)));
      now.append(item);
    }
    if (inv.running.length > runningShown) now.append(el("div", "more", "and " + (inv.running.length - runningShown) + " more"));
    node.append(now);
  }
  if (inv.failures.length) node.append(failuresNode(key, inv));
  return node;
}
function partNode(machine, run, part) {
  const node = el("div", "part");
  const name = el("div", "partname");
  name.append(dot(part.state));
  name.append(el("span", "gpu", part.adapter || part.part));
  if (part.bits) name.append(el("span", "badge", "x" + part.bits));
  const latest = part.invocations[part.invocations.length - 1];
  name.append(el("span", "statetext " + part.state, stateText({state: part.state, silent_since: part.silent_since, end: latest.end})));
  node.append(name);
  for (const inv of part.invocations) node.append(invocationNode([machine, run, part.part, inv.invocation].join("|"), inv));
  return node;
}
function machineNode(machine) {
  const node = el("section", "machine");
  const top = el("div", "top");
  top.append(el("h2", "", machine.name));
  const status = machine.status;
  if (!status) {
    top.append(el("span", "pill bad", "endpoint not reachable"));
    node.append(top, el("div", "note", (machine.url || "") + "  " + (machine.error || "")));
    return node;
  }
  const states = new Set(status.runs.map(run => run.state));
  if (states.has("running")) top.append(el("span", "pill running", "suite running"));
  else if (states.has("silent")) top.append(el("span", "pill silent", "suite silent"));
  else top.append(el("span", "pill", status.runs.length ? "nothing running" : "no reports yet"));
  top.append(el("span", "spacer"));
  if (status.last_report) top.append(el("span", "pill", "last report " + clock(status.last_report)));
  node.append(top);
  if (!status.runs.length) node.append(el("div", "note", "no suite executable has reported to this machine since its status server started"));
  for (const run of status.runs) {
    const box = el("div", "run");
    const name = el("div", "runname");
    name.append(el("b", "", run.run), el("span", "", "first report " + clock(run.first_report)));
    box.append(name);
    for (const part of run.parts) box.append(partNode(machine.name, run.run, part));
    node.append(box);
  }
  return node;
}
async function refresh() {
  const stamp = document.getElementById("stamp");
  try {
    const answer = await fetch("api/machines", {cache: "no-store"});
    const data = await answer.json();
    const scroll = new Map([...document.querySelectorAll(".rows")].map((rows, index) => [index, rows.scrollTop]));
    const focused = document.activeElement && document.activeElement.classList.contains("find");
    if (!focused) {
      const list = document.getElementById("machines");
      list.replaceChildren(...data.machines.map(machineNode));
      if (!data.machines.length) list.append(el("div", "empty", "no machines"));
      [...document.querySelectorAll(".rows")].forEach((rows, index) => { rows.scrollTop = scroll.get(index) || 0; });
    }
    lastGood = Date.now();
    stamp.className = "";
    stamp.textContent = "updated " + new Date().toLocaleTimeString();
  } catch (error) {
    stamp.className = "stale";
    stamp.textContent = "the status server does not answer" + (lastGood ? ", last update " + span((Date.now() - lastGood) / 1000) + " ago" : "");
  }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
