# LSW codegen profile.
#
# Drives the entire generated/ directory: the codegen walks vk.xml's
# <feature> + <extension> elements to derive the command set, then
# emits serialize/deserialize/dispatch C++ for everything in it.
#
# Adding a new extension is one line in [extensions].include and a
# regeneration. The only commands the codegen does NOT touch are listed
# in [commands].exclude — typically platform-tied entry points whose
# create-info can't cross a process boundary (xcb_connection_t*,
# wl_display*, etc.); those are hand-written in src/client.

api_version = "1.3"

[extensions]
include = [
    # Surface + per-platform surface creation.
    "VK_KHR_surface",
    "VK_KHR_xcb_surface",
    "VK_KHR_xlib_surface",
    "VK_KHR_wayland_surface",

    # Swapchain.
    "VK_KHR_swapchain",
]

[commands]
# These ICD entry points are intercepted client-side and never go on
# the wire as their codegen'd shape. Surface creation is per-platform
# and carries process-local pointers (xcb_connection_t*, wl_display*);
# the client sends a custom kCmdCreateXcbSurface frame instead, and
# the server creates the real VkSurfaceKHR via its own xcb connection.
# vkDestroySurfaceKHR is similarly overridden on the client.
exclude = [
    # Loader-negotiation entries: handled in icd_entry.cpp before any
    # transport exists. They can't be wire-routed.
    "vkEnumerateInstanceVersion",
    "vkEnumerateInstanceExtensionProperties",
    "vkEnumerateInstanceLayerProperties",
    "vkGetInstanceProcAddr",
    "vkGetDeviceProcAddr",

    # Surface creation: per-platform, carries process-local pointers.
    # The client sends a custom kCmdCreateXcbSurface frame instead.
    "vkCreateXcbSurfaceKHR",
    "vkCreateXlibSurfaceKHR",
    "vkCreateWaylandSurfaceKHR",
    "vkDestroySurfaceKHR",
    # Win32 surface creation never makes sense on Linux.
    "vkCreateWin32SurfaceKHR",
    # Presentation-support queries are pure client-side decisions.
    "vkGetPhysicalDeviceXcbPresentationSupportKHR",
    "vkGetPhysicalDeviceXlibPresentationSupportKHR",
    "vkGetPhysicalDeviceWaylandPresentationSupportKHR",
    "vkGetPhysicalDeviceWin32PresentationSupportKHR",
]

[platforms]
include = ["common", "linux"]

[sync_overrides]
# Default sync detection: void return + no out-param = async; anything
# with an out-param or VkResult return is sync. Override here when the
# Vulkan spec lets us be optimistic.
#
# A blocking round trip is the dominant cost of a proxied frame, and
# most of them buy nothing. Measured against the real guest: 7.05
# blocking round trips per frame, ~1.2 ms each, which was essentially
# the whole 8.6 ms frame. The command stream itself was not the problem
# — batching had already collapsed 7 vkCmd* calls into one message.
#
# A command belongs here when its VkResult carries no information the
# caller can act on at the point of the call:
#
#   * it can only return VK_SUCCESS or an out-of-memory / device-lost
#     condition, and
#   * that condition is fatal anyway, so it will resurface at the next
#     call that genuinely has to block.
#
# Errors come back out-of-band on the control stream (kCmdAsyncError).
"vkQueueSubmit" = "async"
"vkQueueSubmit2" = "async"
# Command-buffer lifecycle. Begin/End/Reset can each only fail with
# out-of-memory; nothing here is a decision point. Begin and End are
# additionally RECORDED into the buffer's batch (see icd_entries.py),
# so they cost no message at all — End is what ships the batch.
"vkBeginCommandBuffer" = "async"
"vkEndCommandBuffer" = "async"
"vkResetCommandBuffer" = "async"
# vkResetFences cannot fail except on device loss.
"vkResetFences" = "async"
