name: release

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - packaging/aur/**
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Create the GitHub release and update the AUR after building
        type: boolean
        default: false
      issue:
        description: Build for this issue number and publish the packages as its pre-release instead of a release
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      issue: ${{ steps.plan.outputs.issue }}
    steps:
      - uses: actions/checkout@v7

      - name: Version and whether to publish it
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          ISSUE_INPUT: ${{ inputs.issue }}
        run: |
          version="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          [ -n "${version}" ] || { echo "::error::no version in CMakeLists.txt"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the project version ${version}"
              exit 1
          fi
          wanted=false
          case "${GITHUB_EVENT_NAME}" in
              push) wanted=true ;;
              workflow_dispatch) [ "${PUBLISH_INPUT}" = true ] && wanted=true ;;
          esac
          publish=false
          if [ "${wanted}" = true ]; then
              if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                  echo "::notice::LSW ${version} is already released, so this run only builds"
              else
                  publish=true
                  echo "::notice::LSW ${version} is not released yet, so this run publishes it"
              fi
          fi
          issue=""
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ -n "${ISSUE_INPUT}" ]; then
              case "${ISSUE_INPUT}" in
                  *[!0-9]*) echo "::error::issue must be a number, not '${ISSUE_INPUT}'"; exit 1 ;;
              esac
              gh issue view "${ISSUE_INPUT}" --repo "${GITHUB_REPOSITORY}" --json number >/dev/null \
                  || { echo "::error::there is no issue ${ISSUE_INPUT}"; exit 1; }
              issue="${ISSUE_INPUT}"
              version="${version}.issue${issue}"
              publish=false
              echo "::notice::a test build for issue #${issue}, packaged as ${version}; no release and no AUR update"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "issue=${issue}" >> "${GITHUB_OUTPUT}"

  guest:
    name: guest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: archlinux:latest
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
    steps:
      - name: Free disk space
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/*; df -h /

      - name: Bootstrap
        run: pacman -Syu --noconfirm --needed git tar zstd ca-certificates

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory '*'

      - uses: actions/cache@v6
        with:
          path: external/accel-virt/third_party/.cache
          key: accel-virt-downloads-${{ hashFiles('external/accel-virt/tools/*pins.txt', 'external/accel-virt/tools/fetch_*.sh') }}
          restore-keys: accel-virt-downloads-

      - name: Build the guest half
        run: scripts/dist.sh --in-box guest --setup

      - name: Pack the guest half
        run: tar -C build-release --zstd -cf guest.tar.zst guest/stage guest/drivers/av-drivers

      - uses: actions/upload-artifact@v7
        with:
          name: guest
          path: guest.tar.zst
          compression-level: 0
          if-no-files-found: error

  host:
    name: ${{ matrix.target }}
    needs: [plan, guest]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arch
            image: archlinux:latest
            output: dist/lsw-*-x86_64.*
          - target: deb
            image: ubuntu:26.04
            output: dist/*.deb
          - target: rpm
            image: fedora:45
            output: dist/*.rpm
    container:
      image: ${{ matrix.image }}
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
    steps:
      - name: Free disk space
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/*; df -h /

      - name: Bootstrap
        run: |
          if command -v pacman >/dev/null; then
              pacman -Syu --noconfirm --needed git tar zstd ca-certificates
          elif command -v apt-get >/dev/null; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git tar zstd ca-certificates
          else
              dnf -y install git tar zstd ca-certificates
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory '*'

      - uses: actions/cache@v6
        with:
          path: external/accel-virt/third_party/.cache
          key: accel-virt-downloads-${{ hashFiles('external/accel-virt/tools/*pins.txt', 'external/accel-virt/tools/fetch_*.sh') }}
          restore-keys: accel-virt-downloads-

      - uses: actions/download-artifact@v8
        with:
          name: guest

      - name: Unpack the guest half
        run: |
          mkdir -p build-release
          tar -C build-release --zstd -xf guest.tar.zst
          rm guest.tar.zst

      - name: Build and package
        run: scripts/dist.sh --in-box ${{ matrix.target }} --setup --version "${{ needs.plan.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: ${{ matrix.output }}
          compression-level: 0
          if-no-files-found: error

  verify:
    name: verify ${{ matrix.target }}
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arch
            image: archlinux:latest
          - target: deb
            image: ubuntu:26.04
          - target: rpm
            image: fedora:45
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.target }}
          path: dist

      - name: Install the package beside the distribution's QEMU and probe it as libvirt does
        run: scripts/verify-package.sh ${{ matrix.target }} dist

  release:
    name: release
    needs: [plan, host, verify]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      aur: ${{ steps.aur.outputs.enabled }}
      version: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v${VERSION}"
          git fetch --force --tags origin
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
              git tag -l --format='%(contents)' "${tag}" > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md 2>/dev/null; then
              bump="$(git log --format='%H %s' "${GITHUB_SHA}" | awk -v s="LSW ${VERSION}" '{ h = $1; sub(/^[^ ]+ /, ""); if ($0 == s) { print h; exit } }')"
              if [ -n "${bump}" ]; then
                  git log -1 --format=%b "${bump}" > notes.md
              fi
          fi
          if ! grep -q '[^[:space:]]' notes.md 2>/dev/null; then
              previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
              git log --no-merges --format='- %s' ${previous:+"${previous}..${GITHUB_SHA}"} \
                  | grep -vE '^- (LSW|lsw-bin) [0-9]' > notes.md || true
          fi
          cat notes.md
          ls -l dist
          gh release create "${tag}" --title "LSW ${VERSION}" --notes-file notes.md --target "${GITHUB_SHA}" \
              dist/lsw-"${VERSION}"-x86_64.tar.zst dist/lsw-"${VERSION}"-x86_64.tar.zst.sha256 \
              dist/lsw_"${VERSION}"-1_amd64.deb dist/lsw-"${VERSION}"-1.*.x86_64.rpm

      - name: Check for the AUR key
        id: aur
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "${AUR_SSH_KEY}" ]; then
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::The AUR_SSH_KEY secret is not set, so the AUR package was not updated"
          fi

  issue:
    name: issue build
    needs: [plan, host, verify]
    if: needs.plan.outputs.issue != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish the pre-release and tell the issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          ISSUE: ${{ needs.plan.outputs.issue }}
        run: |
          tag="issue-${ISSUE}"
          short="$(git rev-parse --short=10 "${GITHUB_SHA}")"
          tarball="lsw-${VERSION}-x86_64.tar.zst"
          deb="lsw_${VERSION}-1_amd64.deb"
          rpm="$(cd dist && ls lsw-"${VERSION}"-1.*.x86_64.rpm | head -1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          {
              echo "A test build of LSW for #${ISSUE}, from commit ${short} on \`${GITHUB_REF_NAME}\`. It is not a release: it is replaced by the next test build for this issue, and the next release supersedes it."
              echo
              echo "**Any distribution, without installing:** quit LSW, then"
              echo
              echo '```'
              echo "mkdir -p ~/lsw-issue${ISSUE} && tar -C ~/lsw-issue${ISSUE} --zstd -xf ${tarball}"
              echo "~/lsw-issue${ISSUE}/usr/bin/lsw-manager"
              echo '```'
              echo
              echo "It uses your existing Windows and installs its own guest drivers into it. To go back, quit it and start your installed LSW again, which puts its drivers back."
              echo
              echo "**Debian and Ubuntu:** \`sudo apt install ./${deb}\`. **Fedora:** \`sudo dnf install ./${rpm}\`. Install the release package again to go back."
              echo
              echo "Logs for the issue: the Collect logs button in LSW's log panel."
          } > notes.md
          gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --prerelease --latest=false \
              --title "LSW test build for #${ISSUE} (${short})" --notes-file notes.md --target "${GITHUB_SHA}" \
              "dist/${tarball}" "dist/${tarball}.sha256" "dist/${deb}" "dist/${rpm}"
          gh issue comment "${ISSUE}" --repo "${GITHUB_REPOSITORY}" \
              --body "A test build with the changes for this issue (commit ${short}) is at ${url}. The release page says how to run it without replacing your installed LSW."

  aur:
    name: aur
    needs: release
    if: needs.release.outputs.aur == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Bootstrap
        run: pacman -Syu --noconfirm --needed base-devel git namcap openssh

      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory '*'

      - uses: actions/download-artifact@v8
        with:
          name: dist-arch
          path: dist

      - name: Update the PKGBUILD
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          tarball="dist/lsw-${VERSION}-x86_64.tar.zst"
          sum="$(cut -d' ' -f1 "${tarball}.sha256")"
          [ -n "${sum}" ] || { echo "::error::empty checksum"; exit 1; }
          cd packaging/aur
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e 's/^pkgrel=.*/pkgrel=1/' \
              -e "s/^sha256sums=.*/sha256sums=('${sum}')/" PKGBUILD
          mapfile -t listed < <(bash -c 'source PKGBUILD; printf "%s\n" "${depends[@]}"' | sed 's/[<>=].*//')
          missing=()
          while read -r lib; do
              [ -n "${lib}" ] || continue
              printf '%s\n' "${listed[@]}" | grep -qxF "${lib}" && continue
              provided="$(LC_ALL=C pacman -Si "${lib}" | sed -n 's/^Provides *: *//p' | tr ' ' '\n' | sed 's/[<>=].*//')"
              grep -qxFf <(printf '%s\n' "${listed[@]}") <<< "${provided}" && continue
              missing+=("${lib}")
          done < "../../dist/lsw-${VERSION}-x86_64.depends"
          if (( ${#missing[@]} )); then
              echo "::error::The tarball links libraries from packages that packaging/aur/PKGBUILD does not depend on: ${missing[*]}. Review the depends array by hand and release again."
              exit 1
          fi

      - name: SRCINFO and namcap
        run: |
          useradd -m builder
          chown -R builder .
          cd packaging/aur
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          chown builder .SRCINFO
          namcap PKGBUILD | tee namcap.txt
          ! grep -q ' E: ' namcap.txt
          rm namcap.txt

      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          keys="$(mktemp -d)"
          printf '%s\n' "${AUR_SSH_KEY}" > "${keys}/aur"
          chmod 600 "${keys}/aur"
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > "${keys}/known_hosts"
          [ -s "${keys}/known_hosts" ] || { echo "::error::aur.archlinux.org gave no host key"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i ${keys}/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=${keys}/known_hosts"
          git clone ssh://aur@aur.archlinux.org/lsw-bin.git ../aur-repo
          for f in PKGBUILD .SRCINFO lsw-bin.install .gitignore; do
              cp packaging/aur/"${f}" ../aur-repo/
          done
          cd ../aur-repo
          git config user.name acceleration3
          git config user.email acceleration23@gmail.com
          git add PKGBUILD .SRCINFO lsw-bin.install .gitignore
          if git diff --cached --quiet; then
              echo "the AUR already has this version"
          else
              git commit -m "lsw-bin ${VERSION}"
              git push origin HEAD:master
          fi

      - name: Commit packaging/aur to master
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/aur
          if git diff --cached --quiet; then
              echo "packaging/aur is up to date"
          else
              git commit -m "lsw-bin ${VERSION}"
              git push origin HEAD:master
          fi
