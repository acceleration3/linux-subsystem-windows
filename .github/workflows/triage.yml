name: triage issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  logs:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const attached = /https:\/\/github\.com\/user-attachments\/(files|assets)\//.test(body)
              || /\.(tar\.gz|tgz|zip|log|txt)\b/i.test(body);
            const labels = issue.labels.map(l => l.name);
            const has = labels.includes("needs logs");
            const target = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };
            if (attached && has) {
              await github.rest.issues.removeLabel({ ...target, name: "needs logs" });
              return;
            }
            if (attached || has || context.payload.action !== "opened") {
              return;
            }
            await github.rest.issues.addLabels({ ...target, labels: ["needs logs"] });
            await github.rest.issues.createComment({ ...target, body: [
              "Thanks for the report. It has no log archive yet, and most bugs can't be traced without one.",
              "",
              "In the manager, open the **Log** page or **Settings**, press **Collect logs**, and drag the `lsw-logs-....tar.gz` it makes into a comment here, or into the issue by editing it. If the manager can't start, attach `~/.local/share/lsw/logs/manager.log` instead.",
            ].join("\n") });
